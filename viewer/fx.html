<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene(); const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
const frag = `
precision highp float;
varying vec2 vUv;
uniform float t; uniform float seed; uniform float heat; uniform float rise; uniform float grow; uniform float soft; uniform float lift;
float hash(vec3 p){ p = fract(p*0.3183099 + vec3(0.1,0.2,0.3)+seed*0.017); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }

}

    }
  }
